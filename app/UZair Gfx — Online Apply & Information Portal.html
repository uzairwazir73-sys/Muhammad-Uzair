<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>UZair Gfx — Online Apply & Information Portal</title><meta name="description" content="Find admissions, jobs, scholarships, Hajj and Umrah information and apply online.">
<style>
:root{--p:#0E7490;--bg:#F2F5F7;--c:#fff;--t:#16232b;--m:#5b6b75;--b:#dfe6ea;--ok:#15803d;--wa:#b45309;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a20;--c:#14262e;--t:#e8f0f3;--m:#9fb1ba;--b:#25404b}}
:root[data-theme=dark]{--bg:#0d1a20;--c:#14262e;--t:#e8f0f3;--m:#9fb1ba;--b:#25404b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.w{max-width:1000px;margin:auto;padding:12px 14px}.hd{display:flex;align-items:center;gap:10px}.hd img{width:38px;height:38px;border-radius:8px}.hd b{font-size:17px;color:var(--p)}.hd small{display:block;color:var(--m);font-size:11px}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto}nav a{padding:7px 11px;border-radius:8px;color:var(--m);text-decoration:none;white-space:nowrap;font-weight:600;font-size:13px}nav a.on{background:var(--p);color:#fff}
@media(max-width:700px){.hd{flex-wrap:wrap}nav{width:100%;margin:0}}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}button:active{transform:scale(.97)}button.s{background:transparent;color:var(--p);border:1px solid var(--p)}button.d{background:var(--er)}button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:3px 0 8px}label{font-size:12px;color:var(--m);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#0E74901a;color:var(--p);font-weight:700;margin-right:4px}.demo{background:#b453091a;color:var(--wa)}.ok{background:#15803d1a;color:var(--ok)}.er{background:#b91c1c1a;color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.row>button{flex:0 0 auto}h2{margin:14px 0 4px}.m{color:var(--m);font-size:13px}
.warn{background:#b453091a;border-left:4px solid var(--wa);padding:10px;border-radius:8px;font-size:12.5px;margin:10px 0}
.st{display:flex;gap:4px;margin:10px 0}.st i{flex:1;height:6px;border-radius:9px;background:var(--b)}.st i.on{background:var(--p)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid var(--b);text-align:left}.sc{overflow-x:auto}
#sp{position:fixed;inset:0;background:var(--p);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .4s}#sp img{width:96px;border-radius:20px;animation:f 1s}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#16232b;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:100;pointer-events:none}#toast.on{opacity:1}
@media print{header,nav,button{display:none}}

const $=s=>document.querySelector(s),h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OWNER='uzaiirwazir73@gmail.com',CATS=['University','College','Government Job','Private Job','Scholarship','Hajj','Umrah','Online Service'],PROV=['Punjab','Sindh','KPK','Balochistan','Islamabad','Federal'],STS=['Submitted','Under Review','Correction Required','Approved','Rejected','Completed'];
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const seed=()=>[['University','BS Computer Science (Sample)','Sample University A','Punjab',20],['College','FSc Pre-Engineering (Sample)','Sample College B','KPK',9],['Government Job','Junior Clerk BPS-11 (Sample)','Sample Dept. C','Islamabad',3],['Private Job','Graphic Designer (Sample)','Sample Company D','Punjab',14],['Scholarship','Fully Funded Masters (Sample)','Sample Foundation E','Federal',30],['Hajj','Hajj Application Guidance (Sample)','Sample Official Notice','Federal',40],['Umrah','Umrah Package Info (Sample)','Sample Private Provider','Federal',25],['Online Service','CV Preparation (Sample)','UZair Gfx','Federal',60]].map((a,i)=>({id:'o'+i,cat:a[0],title:a[1],org:a[2],province:a[3],deadline:day(a[4]),status:'Published',source:'DEMO DATA',url:'',desc:'Demo listing for preview only. Admin must replace with verified information.',verified:false,demo:true}));
let DB;try{DB=JSON.parse(localStorage.getItem('ugx'))}catch(e){}DB=DB||{users:{},opps:seed(),apps:[],saved:{},notes:[]};
const save=()=>{try{localStorage.setItem('ugx',JSON.stringify(DB))}catch(e){}};
let me=null;try{me=sessionStorage.getItem('ugxs')}catch(e){}
const U=()=>DB.users[me],adm=()=>me===OWNER;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500)};
const left=d=>{const n=Math.ceil((new Date(d)-new Date(day(0)))/864e5);return n<0?['Closed','er']:n==0?['Deadline Today','er']:[n+' Days Left',n<=3?'er':n<=7?'demo':'ok']};
const live=o=>o.status=='Published'&&new Date(o.deadline)>=new Date(day(0));
const hash=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ugx'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const notify=(e,t,m)=>{DB.notes.unshift({to:e,t,m,at:new Date().toLocaleString(),read:false});save()};
let F={q:'',cat:'',prov:'',sort:'new'},tab='dash',AP=null;
function navr(){const l=[['home','Home'],['saved','Saved'],['apps','Applications'],['notes','Notifications'+(me?` (${DB.notes.filter(n=>n.to==me&&!n.read).length})`:'')],['profile',me?'Profile':'Login']];if(adm())l.push(['admin','Admin']);$('#nav').innerHTML=l.map(x=>`<a href="#${x[0]}" class="${location.hash.slice(1).split('/')[0]==x[0]?'on':''}">${x[1]}</a>`).join('')}
const warn='<div class="warn">Please verify important admission, job, scholarship, Hajj and Umrah information from the official organization before submitting an application or making any payment. UZair Gfx is an information and application assistance platform, not a government body, university, HEC, NADRA or any official institution.</div>';
function card(o){const[l,c]=left(o.deadline);return `<div class="card"><span class="tag">${h(o.cat)}</span>${o.demo?'<span class="tag demo">DEMO</span>':''}${o.verified?'<span class="tag ok">VERIFIED SOURCE</span>':''}<h3 style="margin:8px 0 2px">${h(o.title)}</h3><div class="m">${h(o.org)} · ${h(o.province)}</div><p><span class="tag ${c}">${l}</span></p><div class="row"><button onclick="location.hash='#detail/${o.id}'">View</button><button class="s" onclick="sv('${o.id}')">${me&&DB.saved[me]?.includes(o.id)?'Saved ✓':'Save'}</button></div></div>`}
function sv(id){if(!me)return toast('Please login first'),location.hash='#profile';const a=DB.saved[me]=DB.saved[me]||[];const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();route()}
function home(){let L=DB.opps.filter(live).filter(o=>(!F.cat||o.cat==F.cat)&&(!F.prov||o.province==F.prov)&&(o.title+o.org+o.cat+o.province).toLowerCase().includes(F.q.toLowerCase()));L.sort((a,b)=>F.sort=='dl'?a.deadline.localeCompare(b.deadline):F.sort=='az'?a.title.localeCompare(b.title):b.id.localeCompare(a.id));
return `<h2>Find Admissions, Jobs, Scholarships and Online Services</h2><div class="m">${me?'Welcome, '+h(U().name||me):'Login to save and apply.'}</div><div class="card"><input id="q" placeholder="Search jobs, universities, scholarships..." value="${h(F.q)}" oninput="F.q=this.value;rl()"><div class="row"><select onchange="F.cat=this.value;route()"><option value="">All categories</option>${CATS.map(c=>`<option ${F.cat==c?'selected':''}>${c}</option>`).join('')}</select><select onchange="F.prov=this.value;route()"><option value="">All provinces</option>${PROV.map(c=>`<option ${F.prov==c?'selected':''}>${c}</option>`).join('')}</select><select onchange="F.sort=this.value;route()"><option value="new">Newest</option><option value="dl" ${F.sort=='dl'?'selected':''}>Deadline</option><option value="az" ${F.sort=='az'?'selected':''}>A-Z</option></select></div></div>${warn}<div class="g" id="rs">${L.map(card).join('')||'<div class="card">No opportunities found.</div>'}</div>`}
function rl(){const p=$('#q').selectionStart;route();const q=$('#q');q.focus();q.setSelectionRange(p,p)}
function detail(id){const o=DB.opps.find(x=>x.id==id);if(!o)return'<div class="card">Not found.</div>';const[l,c]=left(o.deadline);return `<div class="card"><span class="tag">${h(o.cat)}</span>${o.demo?'<span class="tag demo">DEMO DATA</span>':''}${o.verified?'<span class="tag ok">VERIFIED SOURCE</span>':''}<h2>${h(o.title)}</h2><p>${h(o.org)} · ${h(o.province)}</p><p>${h(o.desc)}</p><p><span class="tag ${c}">${l}</span> Last date: ${h(o.deadline)}</p><p class="m">Source: ${h(o.source)} ${/^https?:\/\//.test(o.url)?`· <a href="${h(o.url)}" target="_blank" rel="noopener">Official link</a>`:''}</p>${warn}<div class="row"><button onclick="startApply('${o.id}')" ${live(o)?'':'disabled'}>Apply Now</button><button class="s" onclick="sv('${o.id}')">Save</button><button class="s" onclick="navigator.share?navigator.share({title:'${h(o.title)}',url:location.href}):toast('Copy the link to share')">Share</button></div></div>`}
function startApply(id){if(!me){toast('Please login first');return location.hash='#profile'}const u=U();AP={id,step:'form',d:{name:u.name||'',father:u.father||'',cnic:u.cnic||'',mobile:u.mobile||'',dob:u.dob||'',qual:u.qual||'',marks:u.marks||''},docs:{}};location.hash='#apply/'+id}
const FL=[['name','Full Name'],['father','Father Name'],['cnic','CNIC (13 digits)'],['mobile','Mobile'],['dob','Date of Birth','date'],['qual','Qualification'],['marks','Marks / Percentage']],DL=[['cnic_front','CNIC Front'],['photo','Passport Photo'],['degree','Degree / DMC (optional)']];
function apply(){const o=DB.opps.find(x=>x.id==AP?.id);if(!o)return'<div class="card">Start from an opportunity.</div>';const stp=['form','preview'].indexOf(AP.step)+1;
if(AP.step=='preview')return `<div class="card"><h2>Application Preview</h2><p class="m">${h(o.title)} — ${h(o.org)}</p>${FL.map(f=>`<div><b>${f[1]}:</b> ${h(AP.d[f[0]])}</div>`).join('')}<div><b>Documents:</b> ${Object.values(AP.docs).map(h).join(', ')||'none'}</div><div class="row" style="margin-top:12px"><button class="s" onclick="AP.step='form';route()">Edit</button><button onclick="submitApp()">Submit Application</button></div></div>`;
return `<div class="card"><h2>Apply: ${h(o.title)}</h2><div class="st"><i class="on"></i><i class="${stp>1?'on':''}"></i></div><p class="m">Pre-filled from your profile. Required: CNIC front and passport photo (JPG, PNG or PDF, max 2 MB).</p>${FL.map(f=>`<label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]||'text'}" value="${h(AP.d[f[0]])}">`).join('')}${DL.map(d=>`<label>${d[1]}</label><input type="file" accept=".jpg,.jpeg,.png,.pdf" onchange="up('${d[0]}',this)"><div class="m" id="d_${d[0]}">${h(AP.docs[d[0]]||'')}</div>`).join('')}<button onclick="toPrev()">Preview</button></div>`}
function up(k,el){const f=el.files[0];if(!f)return;if(!/\.(jpe?g|png|pdf)$/i.test(f.name)||f.size>2e6){el.value='';return toast('Only JPG/PNG/PDF up to 2 MB')}AP.docs[k]=f.name;$('#d_'+k).textContent='✓ '+f.name}
function toPrev(){FL.forEach(f=>AP.d[f[0]]=$('#f_'+f[0]).value.trim());const e=[];if(!AP.d.name)e.push('Please enter your name.');if(!/^\d{13}$/.test(AP.d.cnic.replace(/-/g,'')))e.push('Please enter a valid 13-digit CNIC.');if(!/^\+?\d{10,13}$/.test(AP.d.mobile.replace(/[-\s]/g,'')))e.push('Please enter a valid mobile number.');if(!AP.d.qual)e.push('Please complete your education information.');if(!AP.docs.cnic_front)e.push('Please upload your CNIC.');if(!AP.docs.photo)e.push('Please upload your passport photo.');if(e.length)return toast(e[0]);AP.step='preview';route()}
function submitApp(){const o=DB.opps.find(x=>x.id==AP.id),id='UGX-'+Math.random().toString(36).slice(2,10).toUpperCase();Object.assign(DB.users[me],AP.d);DB.apps.unshift({id,user:me,opp:o.id,title:o.title,org:o.org,cat:o.cat,status:'Submitted',at:new Date().toLocaleString(),data:AP.d,docs:AP.docs,log:[['Submitted',new Date().toLocaleString()]],note:''});notify(me,'Application Submitted',id+' for '+o.title);save();AP=null;location.hash='#receipt/'+id}
function receipt(id){const a=DB.apps.find(x=>x.id==id);return a?`<div class="card"><h2 style="color:var(--ok)">Application Submitted Successfully</h2><h1>${a.id}</h1><div>${h(a.org)} — ${h(a.title)}</div><div class="m">${a.at} · ${a.cat} · ${a.status}</div><div class="row" style="margin-top:12px"><button onclick="print()">Print Receipt</button><button class="s" onclick="location.hash='#apps'">Track</button></div></div>`:''}
function apps(){if(!me)return login();const L=DB.apps.filter(a=>a.user==me);return '<h2>My Applications</h2>'+(L.map(a=>`<div class="card"><b>${a.id}</b> <span class="tag">${a.status}</span><div>${h(a.title)} · ${h(a.org)}</div><div class="st">${STS.map((s,i)=>`<i class="${i<=Math.max(0,STS.indexOf(a.status))?'on':''}" title="${s}"></i>`).join('')}</div><div class="m">${a.log.map(l=>l[0]+' ('+l[1]+')').join(' → ')}</div></div>`).join('')||'<div class="card">No applications yet.<br><br><button onclick="location.hash=\'#home\'">Find opportunities</button></div>')}
function saved(){if(!me)return login();const L=(DB.saved[me]||[]).map(i=>DB.opps.find(o=>o.id==i)).filter(Boolean);return '<h2>Saved Opportunities</h2>'+(L.length?`<div class="g">${L.map(card).join('')}</div>`:'<div class="card">No saved opportunities.</div>')}
function notes(){if(!me)return login();const L=DB.notes.filter(n=>n.to==me);L.forEach(n=>n.read=true);save();return '<h2>Notifications</h2>'+(L.map(n=>`<div class="card"><b>${h(n.t)}</b><div>${h(n.m)}</div><div class="m">${n.at}</div></div>`).join('')||'<div class="card">No notifications.</div>')}
function login(){return `<div class="card" style="max-width:420px;margin:auto"><h2>Login / Create Account</h2><button class="s" style="width:100%" onclick="toast('Google sign-in needs a server backend with your GOOGLE_CLIENT_ID/SECRET — not possible in this preview')">Continue with Google</button><p class="m" style="text-align:center">or use email</p><label>Email</label><input id="em" type="email"><label>Password (min 8)</label><input id="pw" type="password"><button style="width:100%" onclick="doLogin()">Login / Create Account</button></div>`}
async function doLogin(){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;if(!/^\S+@\S+\.\S+$/.test(e)||p.length<8)return toast('Valid email and 8+ character password required');const ph=await hash(p),u=DB.users[e];if(u&&u.ph!=ph)return toast('Wrong password');if(!u)DB.users[e]={email:e,ph,name:'',joined:new Date().toLocaleDateString()};save();me=e;try{sessionStorage.setItem('ugxs',e)}catch(x){}toast('Welcome to Uzair Gfx');location.hash='#home'}
function profile(){if(!me)return login();const u=U();return `<div class="card"><h2>Profile</h2><div class="m">${h(me)}</div>${[['name','Full Name'],['father','Father Name'],['cnic','CNIC'],['mobile','Mobile'],['dob','Date of Birth','date'],['qual','Education'],['province','Province'],['address','Address']].map(f=>`<label>${f[1]}</label><input id="p_${f[0]}" type="${f[2]||'text'}" value="${h(u[f[0]]||'')}">`).join('')}<div class="row"><button onclick="['name','father','cnic','mobile','dob','qual','province','address'].forEach(k=>U()[k]=$('#p_'+k).value);save();toast('Profile saved')">Save Profile</button><button class="s" onclick="me=null;try{sessionStorage.removeItem('ugxs')}catch(e){};location.hash='#home';route()">Logout</button></div><p class="m">Contact: uzaiirwazir73@gmail.com · WhatsApp 0309-5224563</p></div>`}
function admin(){if(!adm())return '<div class="card">Unauthorized access. Admin only.</div>';const T=[['dash','Dashboard'],['opps','Opportunities'],['aps','Applications'],['usr','Users']];let b='';
if(tab=='dash')b=`<div class="g">${[['Users',Object.keys(DB.users).length],['Applications',DB.apps.length],['Pending',DB.apps.filter(a=>['Submitted','Under Review'].includes(a.status)).length],['Active Opportunities',DB.opps.filter(live).length]].map(s=>`<div class="card"><div class="m">${s[0]}</div><h1 style="margin:0;color:var(--p)">${s[1]}</h1></div>`).join('')}</div><div class="card"><b>Applications by category</b>${CATS.map(c=>{const n=DB.apps.filter(a=>a.cat==c).length;return `<div class="row"><span style="flex:0 0 130px">${c}</span><div style="background:var(--p);height:10px;border-radius:9px;flex:0 0 ${n*30}px;min-width:4px"></div><span style="flex:0 0 20px">${n}</span></div>`}).join('')}</div>`;
if(tab=='opps')b=`<div class="card"><h3>Add Opportunity</h3><label>Category</label><select id="a_cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><label>Title</label><input id="a_title"><label>Organization</label><input id="a_org"><label>Province</label><select id="a_prov">${PROV.map(c=>`<option>${c}</option>`).join('')}</select><label>Last date</label><input id="a_dl" type="date"><label>Official application URL (https)</label><input id="a_url"><label>Source name</label><input id="a_src"><label>Description</label><textarea id="a_desc"></textarea><label><input type="checkbox" id="a_ver" style="width:auto"> Verified source</label><div class="row"><button onclick="addOpp('Draft')" class="s">Save Draft</button><button onclick="addOpp('Published')">Publish</button></div></div><div class="card sc"><table><tr><th>Title</th><th>Status</th><th></th></tr>${DB.opps.map(o=>`<tr><td>${h(o.title)}${o.demo?' <span class="tag demo">DEMO</span>':''}</td><td>${o.status}</td><td><button class="s" onclick="tg('${o.id}')">${o.status=='Published'?'Unpublish':'Publish'}</button> <button class="d" onclick="if(confirm('Delete this opportunity?')){DB.opps=DB.opps.filter(x=>x.id!='${o.id}');save();route()}">Del</button></td></tr>`).join('')}</table></div>`;
if(tab=='aps')b=DB.apps.map(a=>`<div class="card"><b>${a.id}</b> · ${h(a.data.name)} · ${h(a.title)}<div class="m">${a.user} · docs: ${Object.values(a.docs).map(h).join(', ')}</div><div class="row"><select id="s_${a.id}">${STS.map(s=>`<option ${s==a.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="setSt('${a.id}')">Update</button></div></div>`).join('')||'<div class="card">No applications yet.</div>';
if(tab=='usr')b=`<div class="card sc"><table><tr><th>Email</th><th>Name</th><th>Joined</th></tr>${Object.values(DB.users).map(u=>`<tr><td>${h(u.email)}</td><td>${h(u.name)}</td><td>${h(u.joined)}</td></tr>`).join('')}</table></div>`;
return `<h2>Admin Panel</h2><div class="row">${T.map(t=>`<button class="${tab==t[0]?'':'s'}" onclick="tab='${t[0]}';route()">${t[1]}</button>`).join('')}</div>${b}`}
function addOpp(st){const g=i=>$('#'+i).value.trim();if(!g('a_title')||!g('a_org')||!g('a_dl'))return toast('Title, organization and last date required');if(g('a_url')&&!/^https:\/\//.test(g('a_url')))return toast('URL must start with https://');DB.opps.unshift({id:'o'+Date.now(),cat:g('a_cat'),title:g('a_title'),org:g('a_org'),province:g('a_prov'),deadline:g('a_dl'),status:st,source:g('a_src')||'Admin',url:g('a_url'),desc:g('a_desc'),verified:$('#a_ver').checked,demo:false});save();toast(st);route()}
function tg(id){const o=DB.opps.find(x=>x.id==id);o.status=o.status=='Published'?'Draft':'Published';save();route()}
function setSt(id){const a=DB.apps.find(x=>x.id==id),s=$('#s_'+id).value;a.status=s;a.log.push([s,new Date().toLocaleString()]);notify(a.user,'Application Status Updated',id+' is now '+s);save();toast('Status updated');route()}
function route(){const[r,p]=location.hash.slice(1).split('/');navr();$('#app').innerHTML=({detail:()=>detail(p),apply:apply,receipt:()=>receipt(p),apps,saved,notes,profile,admin,login})[r]?.()||home()}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
if(!DB.users[me])me=null;route();setTimeout(()=>{$('#sp').style.opacity=0;setTimeout(()=>$('#sp').remove(),400)},1100);
</script></body></html>
